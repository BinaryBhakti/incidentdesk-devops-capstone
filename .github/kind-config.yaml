# kind cluster for the CI deploy job: one control-plane + one worker; port 80 of the control-plane
# node is published on the runner so the NGINX Ingress answers on http://incidentdesk.local
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    labels: { ingress-ready: "true" }
    extraPortMappings:
      - { containerPort: 80, hostPort: 80, protocol: TCP }
  - role: worker
