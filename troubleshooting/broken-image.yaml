# LAB: ImagePullBackOff. The tag below does not exist in the registry.
#   kubectl apply -f troubleshooting/broken-image.yaml
#   kubectl -n incidentdesk get pods -l app=broken-image        -> ErrImagePull / ImagePullBackOff
#   kubectl -n incidentdesk describe pod -l app=broken-image    -> Events: "...not found"
# Fix: kubectl set image deploy/broken-image web=<image>:<commit sha that CI pushed>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image
  namespace: incidentdesk
  labels: { app: broken-image, lab: troubleshooting }
spec:
  replicas: 1
  selector:
    matchLabels: { app: broken-image }
  template:
    metadata:
      labels: { app: broken-image }
    spec:
      containers:
        - name: web
          image: ghcr.io/binarybhakti/incidentdesk-capstone-frontend:this-tag-does-not-exist
          env:
            - { name: BACKEND_URL, value: "http://incidentdesk-backend:8000" }
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
